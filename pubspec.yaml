publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 2.3.14
  geolocator: ^14.0.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.0
  sqflite: ^2.4.0
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^1.0.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
