# Cloud/low-memory friendly: the default Xmx8G heap makes Gradle fail to
# fork its worker processes in sandboxes (Failed to exec spawn helper).
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Lower fork pressure — fewer worker processes spawned at once.
org.gradle.workers.max=2
# Avoid daemon spawn issues in containers/CI.
org.gradle.daemon=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
